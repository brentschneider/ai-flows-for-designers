<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ASSET_PATH}}css/style.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-row">
      <a class="site-title" href="{{ROOT_PATH}}">{{SITE_TITLE}}</a>
      <button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Switch to dark theme">
        <span class="toggle-label toggle-label-light" aria-hidden="true">Light</span>
        <span class="toggle-track">
          <span class="toggle-thumb">
            <span class="toggle-icon toggle-icon-sun" aria-hidden="true">★</span>
            <span class="toggle-icon toggle-icon-moon" aria-hidden="true">⏾</span>
          </span>
        </span>
        <span class="toggle-label toggle-label-dark" aria-hidden="true">Dark</span>
      </button>
    </div>
    <p class="site-tagline">Twelve AI Workflows for Designers</p>
  </header>
  <!--#include:nav-->
  <!--#include:breadcrumb-->
  <main class="page-content">
